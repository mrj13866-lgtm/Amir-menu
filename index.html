<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رستوران لوکس امیر | منو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#5c1a1e;
    --maroon-dark:#3f1114;
    --paper:#f6efdf;
    --paper-2:#efe4c9;
    --gold:#b8892b;
    --gold-light:#d9b45f;
    --ink:#2b1810;
    --muted:#8a6d4f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--maroon-dark);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(184,137,43,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(184,137,43,0.10), transparent 40%);
    font-family:'Vazirmatn', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }

  .book{
    width:100%;
    max-width:640px;
    background:var(--paper);
    border-radius:6px;
    position:relative;
    padding:26px;
    box-shadow:0 25px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(184,137,43,0.25);
  }

  /* ornate frame, echoing the leather-bound menu's floral border */
  .frame{
    position:relative;
    border:2px solid var(--gold);
    border-radius:3px;
    padding:28px 18px 34px;
    background:
      linear-gradient(var(--paper), var(--paper)) padding-box,
      repeating-linear-gradient(45deg, var(--gold-light) 0 2px, transparent 2px 10px) border-box;
  }
  .corner{
    position:absolute;
    width:46px;height:46px;
    opacity:0.9;
  }
  .corner svg{width:100%;height:100%;}
  .corner.tl{top:-2px;right:-2px;transform:scaleX(-1);}
  .corner.tr{top:-2px;left:-2px;}
  .corner.bl{bottom:-2px;right:-2px;transform:scale(-1,-1);}
  .corner.br{bottom:-2px;left:-2px;transform:scaleY(-1);}

  header.menu-header{
    text-align:center;
    margin-bottom:22px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:2px;
    color:var(--muted);
    margin-bottom:6px;
  }
  h1{
    font-family:'Lalezar', 'Vazirmatn', sans-serif;
    font-weight:400;
    font-size:42px;
    color:var(--maroon);
    margin:0 0 6px;
    line-height:1.25;
  }
  .subtitle{
    font-size:13px;
    color:var(--muted);
    margin-bottom:14px;
  }
  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--gold);
    margin:0 auto;
    width:70%;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider svg{width:16px;height:16px;flex-shrink:0;}

  section.category{margin-top:30px;}
  .cat-title{
    font-family:'Lalezar','Vazirmatn',sans-serif;
    font-weight:400;
    font-size:22px;
    color:var(--maroon);
    text-align:center;
    margin-bottom:4px;
  }
  .cat-sub{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    letter-spacing:1px;
    margin-bottom:16px;
  }

  ul.items{list-style:none;margin:0;padding:0;}
  li.item{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:9px 2px;
    border-bottom:1px dotted rgba(138,109,79,0.35);
  }
  li.item:last-child{border-bottom:none;}
  .item-name{
    font-size:15.5px;
    font-weight:500;
    color:var(--ink);
    white-space:nowrap;
  }
  .leader{
    flex:1;
    border-bottom:2px dotted rgba(184,137,43,0.5);
    transform:translateY(-4px);
  }
  .item-price{
    font-size:15px;
    font-weight:700;
    color:var(--maroon);
    white-space:nowrap;
    direction:ltr;
    display:inline-flex;
    align-items:baseline;
    gap:3px;
  }
  .item-price .unit{
    font-size:10.5px;
    font-weight:500;
    color:var(--muted);
  }

  footer.menu-footer{
    margin-top:34px;
    text-align:center;
  }
  .welcome{
    font-family:'Lalezar','Vazirmatn',sans-serif;
    font-size:17px;
    color:var(--maroon);
    margin-bottom:10px;
  }
  .phones{
    font-size:14px;
    color:var(--ink);
    direction:ltr;
    letter-spacing:1px;
    font-weight:600;
  }
  .phones span{color:var(--muted); font-weight:400; direction:rtl; display:inline-block; margin-inline-end:6px;}

  @media (max-width:420px){
    h1{font-size:34px;}
    .item-name{font-size:14px;}
    .item-price{font-size:13.5px;}
  }
</style>
</head>
<body>

<div class="book">
  <div class="frame">

    <div class="corner tl"><svg viewBox="0 0 46 46" fill="none"><path d="M2 44C2 20 20 2 44 2" stroke="#b8892b" stroke-width="2"/><circle cx="8" cy="38" r="2.5" fill="#b8892b"/><circle cx="16" cy="27" r="2" fill="#d9b45f"/><circle cx="27" cy="16" r="2" fill="#d9b45f"/><circle cx="38" cy="8" r="2.5" fill="#b8892b"/></svg></div>
    <div class="corner tr"><svg viewBox="0 0 46 46" fill="none"><path d="M2 44C2 20 20 2 44 2" stroke="#b8892b" stroke-width="2"/><circle cx="8" cy="38" r="2.5" fill="#b8892b"/><circle cx="16" cy="27" r="2" fill="#d9b45f"/><circle cx="27" cy="16" r="2" fill="#d9b45f"/><circle cx="38" cy="8" r="2.5" fill="#b8892b"/></svg></div>
    <div class="corner bl"><svg viewBox="0 0 46 46" fill="none"><path d="M2 44C2 20 20 2 44 2" stroke="#b8892b" stroke-width="2"/><circle cx="8" cy="38" r="2.5" fill="#b8892b"/><circle cx="16" cy="27" r="2" fill="#d9b45f"/><circle cx="27" cy="16" r="2" fill="#d9b45f"/><circle cx="38" cy="8" r="2.5" fill="#b8892b"/></svg></div>
    <div class="corner br"><svg viewBox="0 0 46 46" fill="none"><path d="M2 44C2 20 20 2 44 2" stroke="#b8892b" stroke-width="2"/><circle cx="8" cy="38" r="2.5" fill="#b8892b"/><circle cx="16" cy="27" r="2" fill="#d9b45f"/><circle cx="27" cy="16" r="2" fill="#d9b45f"/><circle cx="38" cy="8" r="2.5" fill="#b8892b"/></svg></div>

    <header class="menu-header">
      <div class="eyebrow">به سلامتی و اشتها</div>
      <h1>رستوران لوکس امیر</h1>
      <div class="subtitle">منوی غذا</div>
      <div class="divider"><svg viewBox="0 0 24 24" fill="#b8892b"><path d="M12 2l2.6 6.6L21 11l-6.4 2.4L12 20l-2.6-6.6L3 11l6.4-2.4z"/></svg></div>
    </header>

    <section class="category">
      <div class="cat-title">غذاهای اصلی</div>
      <div class="cat-sub">چلو کباب &amp; چلو خورشت</div>
      <ul class="items" id="mains"></ul>
    </section>

    <section class="category">
      <div class="cat-title">خوراک دورچین</div>
      <div class="cat-sub">بدون برنج</div>
      <ul class="items" id="khorak"></ul>
    </section>

    <section class="category">
      <div class="cat-title">پیش‌غذا و مخلفات</div>
      <ul class="items" id="apps"></ul>
    </section>

    <section class="category">
      <div class="cat-title">نوشیدنی</div>
      <ul class="items" id="drinks"></ul>
    </section>

    <footer class="menu-footer">
      <div class="divider" style="margin-bottom:14px;"><svg viewBox="0 0 24 24" fill="#b8892b"><path d="M12 2l2.6 6.6L21 11l-6.4 2.4L12 20l-2.6-6.6L3 11l6.4-2.4z"/></svg></div>
      <div class="welcome">به رستوران لوکس امیر خوش آمدید</div>
      <div class="phones"><span>شماره تماس:</span>021-55358084 &nbsp;|&nbsp; 021-55358085</div>
    </footer>

  </div>
</div>

<script>
const data = {
  mains: [
    ["چلو اکبر جوجه","۵۰۰"],
    ["چلو گردن گوسفندی","۱۰۰۰"],
    ["چلو کباب سلطانی","۸۵۰"],
    ["چلو برگ مخصوص","۷۰۰"],
    ["چلو کباب بختیاری","۵۵۰"],
    ["چلو کباب شاهانه (جوجه و کوبیده)","۷۳۰"],
    ["چلو کباب وزیری (جوجه و کوبیده)","۵۹۰"],
    ["چلو کباب نگین","۵۸۰"],
    ["چلو ماهی قزل‌آلا","۵۴۰"],
    ["چلو کباب کوبیده (دو سیخ)","۴۹۰"],
    ["چلو کباب لقمه زعفرانی","۴۴۰"],
    ["چلو جوجه کباب مخصوص","۴۳۰"],
    ["زرشک‌پلو با مرغ","۴۳۰"],
    ["چلو خورشت قیمه","۳۸۰"],
    ["چلو خورشت قورمه سبزی","۳۸۰"]
  ],
  khorak: [
    ["خوراک کوبیده دورچین","۳۷۰"],
    ["خوراک جوجه دورچین","۳۵۰"],
    ["خوراک لقمه دورچین","۳۵۰"],
    ["خوراک مرغ دورچین","۳۵۰"],
    ["خوراک ماهی دورچین","۴۵۰"]
  ],
  apps: [
    ["سالاد فصل","۹۰"],
    ["ماست و خیار","۹۰"],
    ["ماست موسیر","۳۵"],
    ["زیتون","۴۰"]
  ],
  drinks: [
    ["نوشابه خانواده با لیوان","۱۱۰"],
    ["نوشابه قوطی","۶۵"],
    ["نوشابه بطری","۴۰"],
    ["دوغ خانواده با لیوان","۱۰۰"],
    ["دوغ تک‌نفره","۴۰"],
    ["دلستر قوطی","۶۵"]
  ]
};

function render(id, items){
  const ul = document.getElementById(id);
  ul.innerHTML = items.map(([name, price]) => `
    <li class="item">
      <span class="item-name">${name}</span>
      <span class="leader"></span>
      <span class="item-price">${price}<span class="unit">هزار تومان</span></span>
    </li>
  `).join('');
}

render('mains', data.mains);
render('khorak', data.khorak);
render('apps', data.apps);
render('drinks', data.drinks);
</script>

</body>
</html>
